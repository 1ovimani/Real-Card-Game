name: Build World Card Master APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_MANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
            "$SDK_MANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" || \
              "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Ensure debug keystore exists for CI build
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename Debug APK for easy download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/WorldCardMaster-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCardMaster-debug-apk
          path: dist/WorldCardMaster-debug.apk
          retention-days: 30

      - name: Build Signed Release APK & AAB (when GitHub Secrets are configured)
        id: release_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            gradle :app:assembleRelease :app:bundleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk dist/WorldCardMaster-release.apk
            cp app/build/outputs/bundle/release/app-release.aab dist/WorldCardMaster-release.aab
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets not configured; skipping release build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK & AAB Artifacts
        if: steps.release_build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WorldCardMaster-release-builds
          path: |
            dist/WorldCardMaster-release.apk
            dist/WorldCardMaster-release.aab
          retention-days: 30
